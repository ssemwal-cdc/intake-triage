name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Write INTAKE_TOKEN into the build output
        env:
          INTAKE_TOKEN: ${{ secrets.INTAKE_TOKEN }}
        run: |
          set -eu
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='scripts' ./ _site/
          node -e "
            const fs = require('fs');
            const p = '_site/assets/config.js';
            const token = process.env.INTAKE_TOKEN || '';
            let src = fs.readFileSync(p, 'utf8');
            src = src.replace(/token:\s*''/, 'token: ' + JSON.stringify(token));
            fs.writeFileSync(p, src);
          "

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
