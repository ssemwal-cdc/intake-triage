name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Write INTAKE_TOKEN into the build output
        env:
          INTAKE_TOKEN: ${{ secrets.INTAKE_TOKEN }}
        run: |
          set -eu
          if [ -z "${INTAKE_TOKEN:-}" ]; then
            echo "INTAKE_TOKEN secret is empty" >&2
            exit 1
          fi
          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='scripts' ./ _site/
          node -e "
            const fs = require('fs');
            const p = '_site/assets/config.js';
            const token = process.env.INTAKE_TOKEN || '';
            const before = fs.readFileSync(p, 'utf8');
            const after = before.replace(/token:\s*''/, 'token: ' + JSON.stringify(token));
            fs.writeFileSync(p, after);
            if (/token:\s*''/.test(after) || after === before) {
              console.error('INTAKE_TOKEN was not written into _site/assets/config.js (still empty, or replace did not change the file)');
              process.exit(1);
            }
          "

      - name: Cache-bust local asset references
        run: |
          set -eu
          export SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          node -e "
            const fs = require('fs');
            const sha = process.env.SHORT_SHA;
            for (const f of ['_site/index.html', '_site/triage.html']) {
              let s = fs.readFileSync(f, 'utf8');
              s = s.replace(/(src|href)=\"(assets\/[^\"]+\.(?:js|css))\"/g, (m, attr, p) => attr + '=\"' + p + '?v=' + sha + '\"');
              fs.writeFileSync(f, s);
            }
          "

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b  # v4.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
